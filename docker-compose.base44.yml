name: eden-canvas

services:
  web:
    image: node:22
    working_dir: /app
    init: true
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - path: /run/base44/app.env
        required: false
    command:
      - sh
      - -ec
      - |
        npm i -g bun@1 --silent
        bun install --frozen-lockfile
        exec npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    labels:
      - base44.project=Eden Canvas
      - base44.kind=web
      - base44.port=3000

volumes:
  app_node_modules:
